openapi: 3.0.3
info:
  title: 无人健身房 SaaS 首个业务闭环
  version: 1.1.0
  description: 2026-11-12。时段付费、模拟支付、Mock通行、实际到店和超时结算。数据库支持卡权益，但本接口版本不提供卡购买或卡预约；不得把未实现业务伪装为零元现金订单。所有受保护接口验证账号状态与token_version。详见首个业务闭环接口说明。
    数据库审查修复：当前读、设备领取fencing、同设备引用及只追加事实权限见数据库事务与查询约定v1.1；接口路径不变。
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发；部署环境必须使用HTTPS
security:
- bearerAuth: []
tags:
- name: 认证
- name: 门店
- name: 订单
- name: 通行
- name: 到店
- name: 结算
- name: 后台
- name: 开发
