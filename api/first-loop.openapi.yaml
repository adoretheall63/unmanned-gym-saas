      responses:
        '200':
          description: 操作成功；具体业务状态见data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    description: ''
                    enum:
                    - OK
                  message:
                    type: string
                    description: ''
                  requestId:
                    type: string
                    description: ''
                  serverTime: &id001
                    type: string
                    description: 带时区的ISO8601时间点，UTC示例
                    format: date-time
                    example: '2026-11-12T10:00:00.000Z'
