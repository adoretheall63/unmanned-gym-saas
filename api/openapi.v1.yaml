                            etag:
                              type: string
                              pattern: ^"[!#-~]+"$
                              description: 时段配置的强 ETag；PATCH 单个时段时作为 If-Match。
                          required:
                          - id
                          - storeId
                          - startAt
                          - endAt
                          - capacity
                          - remaining
                          - priceCent
                          - status
                          - bookable
                          - unavailableReason
                          - etag
