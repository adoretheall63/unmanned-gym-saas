        权限：顾客 JWT。在同一事务以服务端时间确认离场，重建连续时段实际覆盖并写入普通费、超时结算版本。无争议直接 PAYMENT_DUE 或 SETTLED，有争议 LEFT + REVIEW_REQUIRED；弱证据只推迟入账。撤权异步，不阻止离场；重复结束不重复收退，LEFT 不代表退款到账。
        新预约按快照 ACTUAL_MINUTE_V1；历史无键按 FIXED_SLOT。对本次实际使用的每笔 TIME_FEE 订单，将 [entryAt, exitAt) 与预约 [startAt, endAt) 取交集得到 elapsedMs；提前 5 分钟不计普通费。minutes = min(slotMinutes, ceil(elapsedMs / 60000))，0ms 记 0。令 P 为该订单的 baseAmountCent，usageCent = min(P, floor((P * minutes + floor(slotMinutes / 2)) / slotMinutes))，使用扩大精度整数运算逐单四舍五入到分后合计，不提前把每分钟单价取整。固定价已用段收原基础费，退差为 0；次卡/月卡无现金普通费，次卡仍按原有扣返规则。
        refundCent 是基础费目标退差，不代表到账，不抵扣超时欠费；totalDueCent、paidCent、remainingCent、refundDueCent 仅指超时账单。退差仅适用于已关联的有效实际使用预约；已可靠入场但开场前结束的首笔普通费为 0、全退，未到店或未到达且未关联的连续段按取消或爽约处理。无其他复核阻塞时，按原成功收款及剩余可退额度发起 max(0, P - usageCent)，同一 visitId+orderId+BASE_MINUTE_REFUND 只触发一次；多原款按收款 ID 升序分摊并逐原款去重。证据或额度冲突进入 REVIEW_REQUIRED，不静默截断。钱包退款可在锁定事务内入账，MOCK 按资金状态推进，成功金额以原款退款流水为准。
        最终计价及逐单分配写入结算和同版修订快照；证据修正走 §14.4/14.5 或 gap-19。若成功退差后重算会产生反向收款，保留复核，不自动扣回钱包。
