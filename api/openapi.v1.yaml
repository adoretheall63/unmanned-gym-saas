                      id:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      visitId:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      version:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                        description: 修订版本
                      status:
                        type: string
                        enum:
                        - NOT_READY
                        - REVIEW_REQUIRED
                        - PAYMENT_DUE
                        - SETTLED
                      isEstimate:
                        type: boolean
                        description: 是否为尚未最终确认的预估
