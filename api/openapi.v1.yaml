  "/api/v1/admin/reports/daily":
    get:
      tags:
      - 报表
      operationId: getAdminDailyReport
      summary: 查询自然日日报
      description: 权限：ADMIN 或 REPORT_READ。UTC边界按Asia/Shanghai自然日计算。收退款按完成日，订单按创建日；顾客按当日确认入场去重，新客需查商家历史首次到店；时长按实际区间分日求交。购卡金额只在商家维度统计，传storeId时cardReceiptCent=0且相应分母排除卡单，不虚构购卡门店。未结束到店时长是截止asOf的暂估，updatedAt标注重算时刻。
      security:
      - bearerAuth: []
      x-owner: admin-web
      x-status: planned
      x-contract-ref: '15.2'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: 北京时间日期，必填，不晚于今天
      - name: storeId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 不传为本商家；购卡无门店归属
