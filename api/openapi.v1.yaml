      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: 北京时间日期；可查历史，返回该起始日期的时段
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
