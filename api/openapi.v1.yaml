      - name: visitId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
