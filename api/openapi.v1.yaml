  "/api/v1/app/stores/{storeId}/slots":
    get:
      tags:
      - 门店
      operationId: listAppStoreSlots
      summary: 查询某日时段
      description: 权限：公开。返回尚未开始的时段；不可售时段可列出原因。date超范围422；跨日营业以时段startAt的本地日期归类，不截断跨日时段。 可查询北京时间今天至今天加六天（含）；仅返回 startAt 严格晚于响应时点的时段。
      security: []
      x-owner: mini-app
      x-status: planned
      x-contract-ref: '4.3'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Asia/Shanghai日期，含今天未来七个自然日
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          maxLength: 19
          description: 十进制路径 ID，按整数解析，范围 1..9223372036854775807。
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    properties:
                      storeId:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      date:
                        type: string
                        format: date
                        description: 北京时间日期
                      lastBookableDate:
                        type: string
                        format: date
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                            storeId:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                            startAt:
                              type: string
                              format: date-time
                              pattern: Z$
                              description: UTC 开始时刻；按其 Asia/Shanghai 自然日归类，区间为 [startAt, endAt)。
                            endAt:
                              type: string
                              format: date-time
                              pattern: Z$
                              description: UTC 结束时刻；跨午夜的时段不截断。
                            capacity:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                              description: 该时段配置的正整数预约容量，不等于当前物理空位。
                            remaining:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                              description: 查询时点的预约余量，max(0, capacity - reservedCount)；reservedCount 包含待支付占位及其他尚未释放的承诺量，完成或爽约不释放。余量不是物理空位。
                            priceCent:
                              "$ref": "#/components/schemas/Money"
                              description: 金额，单位分
                            status:
                              type: string
                              enum:
                              - OPEN
                              - CLOSED
                              description: 业务状态，枚举见本行
                            bookable:
                              type: boolean
                              description: 仅在响应时点严格早于 startAt、属于预约窗口、门店与时段均开放销售且 remaining > 0 时为 true；正余量并不代表可预约，也不代表个人已通过下单校验。
                            unavailableReason:
                              type:
                              - string
                              - 'null'
                              description: 不可售原因，例如已开始、停店或时段关闭；没有原因时为 null。
                          required:
                          - id
                          - storeId
                          - startAt
                          - endAt
                          - capacity
                          - remaining
                          - priceCent
                          - status
                          - bookable
                          - unavailableReason
                    required:
                    - storeId
                    - date
                    - lastBookableDate
                    - items
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
        '400':
          "$ref": "#/components/responses/Err400"
        '404':
          "$ref": "#/components/responses/Err404"
        '422':
          "$ref": "#/components/responses/Err422"
          description: INVALID_TIME_RANGE；date 超出北京时间含当天的七日预约窗口。
