                        maximum: 9007199254740991
                      date:
                        type: string
                        format: date
                        description: 北京时间日期
                      lastBookableDate:
                        type: string
                        format: date
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                            storeId:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                            startAt:
                              type: string
                              format: date-time
                              pattern: Z$
                              description: UTC 开始时刻；按其 Asia/Shanghai 自然日归类，区间为 [startAt, endAt)。
                            endAt:
                              type: string
                              format: date-time
                              pattern: Z$
