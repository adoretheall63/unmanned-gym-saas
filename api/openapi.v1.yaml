                            refundCent:
                              "$ref": "#/components/schemas/Money"
                              description: 该段基础费目标退差，不代表退款到账
                        description: 仅列有效且实际关联的现金 TIME_FEE 订单，按 startAt、orderId 升序；不含卡段，不重复分配总额
