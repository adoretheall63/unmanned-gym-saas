---
openapi: 3.1.0
info:
  title: 无人健身房 SaaS 统一接口契约
  version: 2.0.0
  description: |
    两端原型与后端共用的唯一契约。

    - 每个 operation 带 `x-owner`（mini-app / admin-web / backend）与 `x-status`（implemented / planned / reserved）
    - `implemented` 表示 origin/main 上已有 controller 映射，其余为待实现
    - 设备、视频、人脸、灯控（原文档第 10–13 章）本轮不纳入，闭环保通后再补
    - 公共约定见 docs/api-conventions.md
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发；部署必须 HTTPS
security:
- bearerAuth: []
tags:
- name: 认证
- name: 商家与员工
- name: 门店与时段
- name: 顾客与信用
- name: 预约订单
- name: 卡产品与权益
- name: 通行与到店
- name: 账单与资金
- name: 报表与概览
- name: 异常复核
- name: 开发工具
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      additionalProperties: false
      description: 泛型成功信封；通过 allOf 将 data 收窄为当前业务 schema，无业务数据时使用 null。
      required:
      - code
      - message
      - requestId
      - serverTime
      - data
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        requestId: &1
          type: string
          minLength: 1
          examples:
          - req-42
        serverTime: &2
          type: string
          format: date-time
          pattern: Z$
          examples:
          - '2026-11-24T02:30:00Z'
        data:
          description: 业务数据；具体类型由接口限定，未定义业务数据时为 null。
    ApiError:
      type: object
      additionalProperties: false
      description: 非 2xx 的项目 JSON 错误信封，业务码与 HTTP 状态对应。
      required:
      - code
      - message
      - requestId
      - serverTime
      - fieldErrors
      properties:
        code:
          type: string
          minLength: 1
          not:
            const: OK
        message:
          type: string
        requestId: *1
        serverTime: *2
        fieldErrors:
          type: array
          description: 无字段错误时为 []。
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                description: 错误字段或参数路径。
              message:
                type: string
    PageMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: 过滤后、分页前的总数，不是当前页元素个数。
    Page:
      description: 分页数据模板；接口通过 allOf 收窄 properties.items.items 为实际实体 schema。
      allOf:
      - "$ref": "#/components/schemas/PageMeta"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: 当前页，无结果时为 []。
            items: {}
      unevaluatedProperties: false
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 非负金额，单位为分；对应字段名以 Cent 结尾。
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 从 1 开始的页码。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页记录数，超出范围返回 400。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      required: false
      description: 单个排序枚举模板。接口须在本地参数定义中补充 schema.enum 和默认值，不接受裸字段名或表达式。
      schema:
        type: string
        minLength: 1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 非 GET 业务写必填；同一动作重试复用。缺失或格式不符返回 400 VALIDATION_ERROR。
      schema:
        type: string
        minLength: 32
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]{32,128}$"
      example: '0123456789abcdef0123456789abcdef'
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: 配置写必填，回传最近读取的单个强 ETag（含引号）；缺失或空值为 428，不匹配为 412。
      schema:
        type: string
      example: '"cfg-17"'
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方的链路标识。普通请求提供非空值时透传至响应头和正文，未传时由服务端生成；幂等重放沿用首次响应标识。
      schema: *1
  responses:
    Err400:
      description: VALIDATION_ERROR；请求格式、字段或参数非法，或业务写缺少幂等键。
      headers: &3
        X-Request-Id:
          "$ref": "#/components/headers/XRequestId"
      content: &4
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    Err401:
      description: UNAUTHENTICATED；未登录、凭据无效、过期或已撤销。
      headers: *3
      content: *4
    Err403:
      description: FORBIDDEN；身份无操作权限或账号已停用。另见 operation 明列的专用 403 业务码。
      headers: *3
      content: *4
    Err404:
      description: NOT_FOUND；资源或路由不存在、资源对请求主体不可见。另见 operation 明列的专用 404 业务码。
      headers: *3
      content: *4
    Err409:
      description: STATE_CONFLICT（状态/业务唯一键冲突）、IDEMPOTENCY_CONFLICT（同键异请求），或 operation 明列的专用 409 业务码。
      headers: *3
      content: *4
    Err412:
      description: ETAG_MISMATCH；If-Match 与当前配置 ETag 不匹配。
      headers: *3
      content: *4
    Err422:
      description: PHONE_BINDING_UNAVAILABLE（未提供手机号绑定能力），或 operation 明列的专用 422 业务码。
      headers: *3
      content: *4
    Err428:
      description: PRECONDITION_REQUIRED；配置写缺少 If-Match 或值为空。
      headers: *3
      content: *4
    Err429:
      description: RATE_LIMITED；超过请求频率限制。
      headers: *3
      content: *4
    Err503:
      description: DEPENDENCY_UNAVAILABLE；依赖暂不可用，或 operation 明列的专用 503 业务码。
      headers: *3
      content: *4
  headers:
    ETag:
      description: 配置的强实体标签；读取时返回当前值，配置写成功后返回新值（配置仍存在时）。
      schema:
        type: string
        pattern: ^"[!#-~]+"$
      example: '"cfg-17"'
    IdempotentReplay:
      description: 仅重放首次成功响应时返回此头，字面值为 true。
      schema:
        type: string
        const: 'true'
    XRequestId:
      description: 与响应正文 requestId 一致；幂等重放沿用首次响应的值。
      required: true
      schema: *1
paths:
  "/api/v1/app/auth/wechat-login":
    post:
      tags:
      - 认证
      operationId: loginWithWechat
      summary: 微信登录
      description: 通过微信兑换临时 code；微信服务不可用返回 503。不按手机号自动合并账号。
      security: []
      x-owner: backend
      x-status: implemented
      x-contract-ref: '2.1'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: wx.login 返回的临时 code。
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - accessToken
                    - tokenType
                    - expiresIn
                    - customer
                    properties:
                      accessToken:
                        type: string
                        description: JWT；不写日志或幂等快照。
                      tokenType:
                        type: string
                        enum:
                        - Bearer
                      expiresIn:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        description: 令牌有效期，单位为秒。
                      customer:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - nickname
                        - phoneVerified
                        properties:
                          id:
                            type: integer
                            minimum: 1
                            maximum: 9007199254740991
                          nickname:
                            type:
                            - string
                            - 'null'
                          phoneVerified:
                            type: boolean
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
          "$ref": "#/components/responses/Err401"
        '429':
          "$ref": "#/components/responses/Err429"
        '503':
          "$ref": "#/components/responses/Err503"
  "/api/v1/admin/auth/login":
    post:
      tags:
      - 认证
      operationId: loginAdmin
      summary: 后台登录
      description: 校验 BCrypt 密码并返回本商家身份；无效凭据统一 401，账号停用返回 403，登录尝试受限流。
      security: []
      x-owner: backend
      x-status: implemented
      x-contract-ref: '2.2'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
                  description: 不记录密码。
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - accessToken
                    - tokenType
                    - expiresIn
                    - admin
                    properties:
                      accessToken:
                        type: string
                        description: JWT；不写日志或幂等快照。
                      tokenType:
                        type: string
                        enum:
                        - Bearer
                      expiresIn:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        description: 令牌有效期，单位为秒。
                      admin:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - merchantId
                        - username
                        - role
                        - permissions
                        properties:
                          id:
                            type: integer
                            minimum: 1
                            maximum: 9007199254740991
                          merchantId:
                            type: integer
                            minimum: 1
                            maximum: 9007199254740991
                          username:
                            type: string
                          role:
                            type: string
                            enum:
                            - ADMIN
                            - OPERATOR
                          permissions:
                            type: array
                            items:
                              type: string
                              enum:
                              - STORE_READ
                              - STORE_CONTROL
                              - CUSTOMER_READ
                              - ORDER_READ
                              - VISIT_READ
                              - CARD_READ
                              - FINANCE_READ
                              - DEVICE_READ
                              - DEVICE_CONTROL
                              - VIDEO_READ
                              - LIGHT_CONTROL
                              - REVIEW_READ
                              - REVIEW_HANDLE
                              - REPORT_READ
                              - REPORT_REFRESH
                              - AUDIT_READ
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
          "$ref": "#/components/responses/Err401"
        '403':
          "$ref": "#/components/responses/Err403"
        '429':
          "$ref": "#/components/responses/Err429"
        '503':
          "$ref": "#/components/responses/Err503"
  "/api/v1/app/auth/logout":
    post:
      tags:
      - 认证
      operationId: logoutApp
      summary: 退出顾客全部登录
      description: 需顾客 JWT。递增本顾客 token_version，使其全部旧 JWT 失效；若响应丢失，旧令牌返回 401 也视为已退出。
      security:
      - bearerAuth: []
      x-owner: backend
      x-status: implemented
      x-contract-ref: '2.3'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - accepted
                    properties:
                      accepted:
                        type: boolean
                        description: 请求已受理。
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
          "$ref": "#/components/responses/Err401"
        '503':
          "$ref": "#/components/responses/Err503"
  "/api/v1/admin/auth/logout":
    post:
      tags:
      - 认证
      operationId: logoutAdmin
      summary: 退出后台全部登录
      description: 需后台 JWT。递增本账号 token_version，使其全部旧 JWT 失效；若响应丢失，旧令牌返回 401 也视为已退出。
      security:
      - bearerAuth: []
      x-owner: backend
      x-status: implemented
      x-contract-ref: '2.4'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - accepted
                    properties:
                      accepted:
                        type: boolean
                        description: 请求已受理。
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
          "$ref": "#/components/responses/Err401"
        '403':
          "$ref": "#/components/responses/Err403"
        '503':
          "$ref": "#/components/responses/Err503"
  "/api/v1/app/me":
    get:
      tags:
      - 个人资料
      operationId: getAppProfile
      summary: 读取本人资料
      description: 需顾客 JWT。不返回微信 openid、手机号密文或人脸原图。
      security:
      - bearerAuth: []
      x-owner: mini-app
      x-status: implemented
      x-contract-ref: '2.5'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - nickname
                    - phoneMasked
                    - phoneVerified
                    properties:
                      id:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      nickname:
                        type:
                        - string
                        - 'null'
                      phoneMasked:
                        type:
                        - string
                        - 'null'
                        description: 已验证手机号的脱敏值；未绑定时为 null。
                      phoneVerified:
                        type: boolean
        '401':
          "$ref": "#/components/responses/Err401"
        '503':
          "$ref": "#/components/responses/Err503"
    patch:
      tags:
      - 个人资料
      operationId: updateAppNickname
      summary: 修改本人昵称
      description: 需顾客 JWT。只接受 nickname，不修改身份、角色或商家归属。
      security:
      - bearerAuth: []
      x-owner: mini-app
      x-status: implemented
      x-contract-ref: '2.6'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      - "$ref": "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - nickname
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
            Idempotent-Replay:
              "$ref": "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - nickname
                    - phoneMasked
                    - phoneVerified
                    properties:
                      id:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      nickname:
                        type:
                        - string
                        - 'null'
                      phoneMasked:
                        type:
                        - string
                        - 'null'
                        description: 已验证手机号的脱敏值；未绑定时为 null。
                      phoneVerified:
                        type: boolean
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
          "$ref": "#/components/responses/Err401"
        '409':
          "$ref": "#/components/responses/Err409"
        '503':
          "$ref": "#/components/responses/Err503"
  "/api/v1/app/me/phone-binding":
    post:
      tags:
      - 个人资料
      operationId: bindAppPhone
      summary: 绑定已验证手机号
      description: 需顾客 JWT。后端向微信兑换一次性授权码，加密保存已验证手机号；未开通能力返回 422，不影响预约。授权码不入日志或快照；幂等指纹只保留不可逆摘要。号码已归另一主体返回 409 PHONE_ALREADY_BOUND。
      security:
      - bearerAuth: []
      x-owner: mini-app
      x-status: implemented
      x-contract-ref: '2.7'
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      - "$ref": "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phoneCode
              properties:
                phoneCode:
                  type: string
                  minLength: 1
                  maxLength: 512
                  writeOnly: true
                  description: 本次微信授权的一次性兑换 code，不接受手机号明文。
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
            Idempotent-Replay:
              "$ref": "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - requestId
                - serverTime
                - data
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - nickname
                    - phoneMasked
                    - phoneVerified
                    properties:
                      id:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      nickname:
                        type:
                        - string
                        - 'null'
                      phoneMasked:
                        type:
                        - string
                        - 'null'
                        description: 已验证手机号的脱敏值；未绑定时为 null。
                      phoneVerified:
                        type: boolean
        '400':
          "$ref": "#/components/responses/Err400"
        '401':
