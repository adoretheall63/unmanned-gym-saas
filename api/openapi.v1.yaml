                        description: 向上取整的超时分钟数
                      overtimePriceCent:
                        "$ref": "#/components/schemas/Money"
                        description: 金额，单位分
                      overtimeCapCent:
                        "$ref": "#/components/schemas/Money"
                        description: 金额，单位分
                      overtimeAmountCent:
                        "$ref": "#/components/schemas/Money"
