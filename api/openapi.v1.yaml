    post:
      tags:
      - 通行凭证与实际到店
      operationId: createAppOrderOpenRequest
      summary: 申请订单开门
      description: 权限：顾客 JWT。扫码与长按提交同一订单 OPEN 请求。默认 SCAN，须传 scanCode 定位订单门店的 ENTRY；选择 DEFAULT_ENTRY 时省略 scanCode，由服务端按订单门店解析已授权的默认 ENTRY。默认入口缺失、授权窗口未确认或无可靠远程开门能力时返回 422 CAPABILITY_UNSUPPORTED，并引导扫码。长按时长由 UI 处理；禁止传设备编号、定位坐标或开门密钥替代授权。逐次核验本人、目标版本、商家限制、订单、门店准入、设备在线及能力并限流；最早可在开场前 5 分钟且有效授权窗口内开门，提前开门须核验实时容量和跨店冲突。未决自动开门计入占位；UNKNOWN 阻断新放行直至核实。长按用户明确同意自动计时后提交 startVisitOnSuccess=true，服务端将意图写入命令摘要。202 仅表示受理，不创建到店、不开始计时；同订单未决或成功可消费任务返回已有任务，换键不重复开门。
      security:
      - bearerAuth: []
      x-owner: mini-app
      x-status: planned
      x-contract-ref: '8.2'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - "$ref": "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scanCode:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: SCAN 必传；DEFAULT_ENTRY 不传，由服务端解析订单门店已授权且有效的默认入口。
                mode:
                  type: string
                  enum:
                  - SCAN
                  - DEFAULT_ENTRY
                  default: SCAN
                  description: 默认 SCAN；无扫码长按用 DEFAULT_ENTRY
                startVisitOnSuccess:
                  type: boolean
                  default: false
                  description: 本人明确同意自动计时后由长按流程传 true，默认 false。
              if:
                required:
                - mode
                properties:
                  mode:
                    const: DEFAULT_ENTRY
