                            capacity:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                              description: 该时段配置的正整数预约容量，不等于当前物理空位。
                            remaining:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                              description: 查询时点的预约余量，max(0, capacity - reservedCount)；reservedCount 包含待支付占位及其他尚未释放的承诺量，完成或爽约不释放。余量不是物理空位。
                            priceCent:
                              "$ref": "#/components/schemas/Money"
                              description: 金额，单位分
                            status:
                              type: string
                              enum:
                              - OPEN
                              - CLOSED
                              description: 业务状态，枚举见本行
                            bookable:
                              type: boolean
                              description: 仅在响应时点严格早于 startAt、属于预约窗口、门店与时段均开放销售且 remaining > 0 时为 true；正余量并不代表可预约，也不代表个人已通过下单校验。
                            unavailableReason:
                              type:
                              - string
                              - 'null'
