  "/api/v1/app/stores":
    get:
      tags:
      - 门店
      operationId: listAppStores
      summary: 公开营业门店列表
      description: 权限：公开。只返回启用商家的公开营业门店。每张卡片显示商家名；不返回员工、密钥或敏感设备数据。 坐标须为 WGS84 并成对提供；未授权定位时不发送坐标或 sort，不保存顾客坐标或记录定位日志。分页前按 Haversine 大圆距离（半径 6371008.8 米）计算并四舍五入为整数米，DISTANCE 按距离、id 升序。预约摘要来自同一快照中含当天七个北京时间自然日内第一个尚未开始且 OPEN 的时段，余量为零仍返回该时段。实时入场展示优先级为 ADMISSION_PAUSED > FULL > UNKNOWN > AVAILABLE，与预约状态独立；最终预约和入场资格仍由服务端锁内校验。
      security: []
      x-owner: mini-app
      x-status: planned
      x-contract-ref: '4.1'
      x-gap-refs:
      - gap-2
      - gap-4
      - gap-32
      parameters:
      - "$ref": "#/components/parameters/XRequestIdHeader"
      - "$ref": "#/components/parameters/PageParam"
      - "$ref": "#/components/parameters/PageSizeParam"
      - name: latitude
        in: query
        description: WGS84 纬度；与 longitude 成对，DISTANCE 时必填。
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        description: WGS84 经度；与 latitude 成对，DISTANCE 时必填。
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: sort
        in: query
        description: CREATED_AT 按创建时间、id 倒序；DISTANCE 要求提供完整坐标。
        schema:
          type: string
          enum:
          - CREATED_AT
          - DISTANCE
          default: CREATED_AT
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                  serverTime:
                    type: string
                    format: date-time
                    pattern: Z$
                  data:
                    allOf:
                    - "$ref": "#/components/schemas/Page"
                    - properties:
                        items:
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                minimum: 1
                                maximum: 9007199254740991
                              merchantId:
                                type: integer
                                minimum: 1
                                maximum: 9007199254740991
                              merchantName:
                                type: string
                                description: 商家名称
                              name:
                                type: string
                                description: 名称
                              address:
                                type: string
                                description: 门店地址
                              status:
                                type: string
                                enum:
                                - OPEN
                                - CLOSED
                                - DISABLED
                                description: 业务状态，枚举见本行
                              slotPriceCent:
                                "$ref": "#/components/schemas/Money"
                                description: 当前默认价格
                              estimatedOccupancy:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                maximum: 9007199254740991
                                description: 按确认进出计算，未知为null
                              occupancySource:
                                type: string
                                enum:
                                - CONFIRMED_RECORDS
                                - UNKNOWN
                              deviceSource:
                                type: string
                                enum:
                                - MOCK
                                - EZVIZ
                                - MIXED
                                - UNKNOWN
                              coverImageUrl:
                                type:
                                - string
                                - 'null'
                                format: uri
                                description: 首张已公开且可解析的图片地址；无封面时为 null。
                              latitude:
                                type: number
                                format: double
                                minimum: -90
                                maximum: 90
                                description: 门店 WGS84 纬度。
                              longitude:
                                type: number
                                format: double
                                minimum: -180
                                maximum: 180
                                description: 门店 WGS84 经度。
                              distanceMeters:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                maximum: 9007199254740991
                                description: 距请求坐标的距离，单位米；未提供顾客坐标时为 null。
                              admissionPaused:
                                type: boolean
                                description: 当前是否暂停新入场。
                              liveFull:
                                type:
                                - boolean
                                - 'null'
