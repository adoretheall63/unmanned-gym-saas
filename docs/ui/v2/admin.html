<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONO · 商家后台</title>
<style>
@font-face{
  font-family:"InterTight";
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2");
  font-weight:100 900;font-display:swap;
}
:root{
  --void:#0A0A0B;--paper:#121214;--paper-2:#191A1D;--paper-3:#222326;
  --ink:#F2F1EE;--ink-2:#A4A39F;--ink-3:#6C6B68;
  --hair:rgba(242,241,238,.10);--hair-2:rgba(242,241,238,.19);
  --signal:#FF4A1C;--ok:#5FE39A;--ease:cubic-bezier(.32,.72,0,1);
  --u:"InterTight",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --heat-0:rgba(242,241,238,.04);--heat-1:rgba(242,241,238,.10);
  --heat-2:rgba(242,241,238,.18);--heat-3:rgba(242,241,238,.32);--heat-4:rgba(242,241,238,.52);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.5 var(--u);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--ink-2);outline-offset:3px}
h1,h2,h3,p,dl{margin:0}
h1{font-size:19px;font-weight:600}
h2,h3{font-size:15px;font-weight:600}
strong,th{font-weight:600}
svg{display:block}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.u{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}.urgent{color:var(--signal)}
.sidebar{position:fixed;inset:0 auto 0 0;width:224px;border-right:1px solid var(--hair);background:var(--void);display:flex;flex-direction:column;padding:0 16px;z-index:2}
.brand{display:flex;align-items:center;gap:9px;height:56px;padding:0 8px;border-bottom:1px solid var(--hair);font-size:15px;font-weight:600;letter-spacing:.11em}
.mark{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4}
.brand .u{margin-left:auto;letter-spacing:.05em}
.nav-label{margin:24px 12px 9px}
.nav-group{display:grid;gap:3px}
.nav-group+.nav-label{margin-top:24px;padding-top:16px;border-top:1px solid var(--hair)}
.nav-link{display:flex;align-items:center;gap:11px;height:37px;padding:0 12px;border-radius:8px;color:var(--ink-2)}
.nav-link .nav-n{margin-left:auto;color:var(--ink-3)}
.nav-link:hover{background:var(--paper);color:var(--ink)}
.nav-link[aria-current=page]{background:var(--paper-3);color:var(--ink);font-weight:500}
.side-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:auto 8px 0;padding:16px 0;border-top:1px solid var(--hair)}
.shell{margin-left:224px}
.top{height:56px;position:sticky;top:0;z-index:1;background:var(--paper);border-bottom:1px solid var(--hair);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top-left,.top-controls,.control-wrap,.section-head,.tools{display:flex;align-items:center;gap:12px}
.top-left .u{padding-right:12px;border-right:1px solid var(--hair-2)}
.top-controls{gap:10px}
.control-wrap{position:relative;gap:0}
.control-wrap>.icon{position:absolute;left:10px;color:var(--ink-2);pointer-events:none}
select,input:not([type=checkbox]){min-height:34px;border:1px solid var(--hair-2);border-radius:8px;background:var(--paper);padding:0 10px}
.control-wrap:has(>.icon)>:is(select,input){padding-left:34px}
select{padding-right:26px;appearance:none;cursor:pointer}
.control-wrap::after,.field-select::after{content:"";pointer-events:none;position:absolute;right:11px;top:calc(50% - 4px);width:5px;height:5px;border:solid var(--ink-2);border-width:0 1px 1px 0;transform:rotate(45deg)}
.control-wrap:has(input)::after{display:none}
input::placeholder{color:var(--ink-2)}
.avatar{display:grid;place-items:center;width:30px;height:30px;margin-left:4px;background:var(--paper-3);border-radius:999px;border:1px solid var(--hair-2);font-size:11px;font-weight:600}
main{padding:32px;view-transition-name:screen}
.content{padding-right:32px;transition:padding-right 320ms var(--ease)}
body:has(#drawer[open]) .content{padding-right:420px}
.screen{min-width:0}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(screen),::view-transition-old(screen),::view-transition-new(screen){animation-duration:160ms}
::view-transition-group(screen){animation-name:none}
.screen.enter{animation:enter 160ms ease both}
@keyframes enter{from{opacity:0}to{opacity:1}}
.section-head{justify-content:space-between;min-height:28px;margin-bottom:12px}
.section-id{display:inline-block;margin-right:12px;color:var(--ink-3);font-size:11px;font-weight:500}
.section-meta{display:flex;align-items:center;gap:10px;white-space:nowrap}
.section-meta .legend{display:flex;gap:3px}
.legend i{width:10px;height:10px;border-radius:3px}
.block+.block{margin-top:32px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:16px;border-bottom:1px solid var(--hair)}
.kpi{padding:0 22px;border-left:1px solid var(--hair);display:flex;min-width:0;flex-direction:column;justify-content:space-between}
.kpi:first-child{padding-left:0;border:0}
.kpi-value{display:flex;align-items:baseline;gap:6px;font-size:34px;line-height:1;font-weight:500;margin-top:10px}
.hero-number{font-size:52px}
.kpi .unit{font-size:13px;color:var(--ink-3);font-weight:400}
.heat-scroll{display:grid;gap:8px;overflow-x:auto}
.heat-row{display:grid;grid-template-columns:160px repeat(11,minmax(0,1fr)) 88px;gap:3px;align-items:center;min-width:560px}
.heat-row>:last-child{text-align:right;font-variant-numeric:tabular-nums}
.heat-row:not(.heat-head){font-size:13px;color:var(--ink-2)}
.heat-hour{position:relative;text-align:center;letter-spacing:0;font-weight:500;line-height:29px}
.heat-hour.now::before{content:"";height:2px;position:absolute;inset:0 0 auto;background:var(--signal)}
.tile{display:block;height:32px;border-radius:4px}
.pending-list{border-top:1px solid var(--hair)}
.pending{display:grid;grid-template-columns:minmax(170px,1fr) 1fr 64px 16px;align-items:center;gap:12px;min-height:38px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);position:relative}
.pending::before{content:"";width:2px;position:absolute;inset:0 auto -1px 0;background:var(--signal)}
.pending:hover,.clickable:hover{background:var(--paper-2)}
.pending time{text-align:right}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;position:relative}
.bars::before{content:"";height:1px;position:absolute;inset:99px 0 auto;background:var(--hair-2)}
.bar-slot{text-align:center;min-width:0}
.bar-lane{height:100px;padding-bottom:1px;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;gap:4px}
.bar-lane i{width:44%;max-width:80px;background:var(--heat-2);border-radius:3px 3px 0 0}
.bar-slot.peak i{background:var(--heat-4)}
.bar-slot time{display:block;margin-top:8px}
.btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn.line{border:1px solid var(--hair-2);color:var(--ink)}
.btn.line:hover{background:var(--paper-3)}
.btn.prime{background:var(--ink);color:var(--void);border:1px solid var(--ink)}
.btn.prime:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.sm{height:28px;padding:0 10px}
.icon-btn{height:34px;width:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-3);color:var(--ink)}
.tools{margin-bottom:16px;flex-wrap:wrap}
.tools .end{margin-left:auto}
.table-wrap{overflow-x:auto}
table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left;white-space:nowrap}
table[aria-label="订单"]{min-width:655px}
table[aria-label="设备事件"]{min-width:740px}
table[aria-label="待复核结算"]{min-width:740px}
table[aria-label="已结算"]{min-width:524px}
table[aria-label="结算修订记录"]{min-width:536px}
table[aria-label="会员"]{min-width:660px}
table[aria-label="卡产品"]{min-width:602px}
table[aria-label="信用扣分记录"]{min-width:584px}
table[aria-label="管理员列表"]{min-width:466px}
th,td{height:44px;padding:0 16px;border-bottom:1px solid var(--hair)}
th{border-top:1px solid var(--hair);text-align:left}
th button{display:flex;align-items:center;gap:7px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
th[aria-sort=ascending],th[aria-sort=descending],th button:hover{color:var(--ink)}
td{color:var(--ink-2)}
#orders :is(th,td){padding-inline:10px}
#orders td:nth-child(3),#orders td:nth-child(7){white-space:normal}
#orders td:nth-child(3) span{white-space:nowrap}
td:first-child,.primary-cell{color:var(--ink);font-weight:500}
.num{text-align:right}
.num>button{margin-left:auto}
.clickable{cursor:pointer}
.row-link{color:var(--ink);font-weight:500;text-align:left}
.empty{padding:20px 0;color:var(--ink-2)}
td.empty{text-align:center}
.status{display:inline-flex;gap:7px;align-items:center;color:var(--ink-3);white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
.status.ok{color:var(--ink-2)}.status.ok::before{background:var(--ok)}
.status.attn::before{background:var(--signal)}.status.attn.loud{color:var(--signal)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--hair);margin-bottom:16px}
.tab{height:38px;color:var(--ink-2);border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs+* th{border-top:0}
.store-layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:32px}
.store-list{border-right:1px solid var(--hair);padding-right:16px}
.store-list button{width:100%;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--hair);color:var(--ink-2)}
.store-list button:hover,.store-list [aria-pressed=true]{background:var(--paper-2);color:var(--ink)}
.fact-list{border-top:1px solid var(--hair)}
.fact{min-height:37px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--hair)}
.fact dt{color:var(--ink-2)}.fact dd{margin:0;text-align:right}
.capacity-rail{display:grid;grid-template-columns:repeat(11,minmax(24px,1fr));gap:3px}
.capacity-rail label{display:grid;gap:6px;text-align:center;min-width:0}
.capacity-rail .sample{height:24px;background:var(--heat-2);border-radius:3px}
.capacity-rail input{min-width:0;width:100%;padding:0;text-align:center;border:0;border-bottom:1px solid transparent;border-radius:0;appearance:textfield}
.capacity-rail input::-webkit-inner-spin-button,.capacity-rail input::-webkit-outer-spin-button{appearance:none}
.capacity-rail input:focus{border-bottom-color:var(--signal);outline:none}
.device-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.device{background:var(--paper);border:1px solid var(--hair-2);border-radius:12px;padding:16px}
.device .section-head{min-height:24px;margin-bottom:5px}
.device .fact-list{margin-top:13px}
.device .fact:last-child{border-bottom:0;padding-bottom:0;min-height:30px}
.score{display:flex;align-items:baseline;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--hair)}
.score strong{font-size:52px;font-weight:500;line-height:1}
.danger p{max-width:52ch;margin:8px 0 14px}
dialog{position:fixed;inset:0 0 0 auto;z-index:4;margin:0;width:420px;max-width:100%;height:100%;max-height:none;padding:0;border:0;border-left:1px solid var(--hair);border-radius:12px 0 0 12px;background:var(--paper);color:var(--ink);transform:translateX(100%);transition:transform 320ms var(--ease),display 320ms allow-discrete}
dialog[open]{display:flex;flex-direction:column;transform:translateX(0)}
@starting-style{dialog[open]{transform:translateX(100%)}}
.drawer-head{flex:none;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair)}
.drawer-head h2{font-size:19px;margin-top:2px}
.drawer-body{overflow:auto;flex:1;display:grid;align-content:start;gap:24px;padding:22px 24px 24px}
.drawer-body h3{margin-bottom:9px}
.drawer-foot{display:flex;gap:8px;flex-wrap:wrap;flex:none;border-top:1px solid var(--hair);padding:14px 24px}
.drawer-foot:empty{display:none}
.form-fields{display:grid;gap:13px}
.form-fields label{display:grid;gap:5px}
.field-select{position:relative}.field-select select{width:100%}
.notice{position:fixed;z-index:3;inset:auto 32px 24px auto;background:var(--paper-2);border:1px solid var(--hair-2);border-radius:8px;padding:10px 14px}
@media(max-width:1050px){.device-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.store-layout{grid-template-columns:144px minmax(0,1fr)}}
@media(max-width:800px){.sidebar{width:56px;padding:0 7px}.brand{padding:0;justify-content:center}.brand span,.nav-link span,.side-foot,.nav-label{display:none}.nav-group{margin-top:16px}.nav-link{justify-content:center;padding:0}.shell{margin-left:56px}.top{padding-inline:16px}main{padding-left:16px}.top-left .u{display:none}.kpi{padding-inline:8px}.kpi-value{font-size:19px}.hero-number{font-size:34px}.store-layout{display:block}.store-list{margin-bottom:16px;border:0;padding:0;display:flex;flex-wrap:wrap}.store-list button{width:auto}}
@media(max-width:520px){.device-grid{grid-template-columns:1fr}.top-controls .control-wrap>.icon{display:none}.top-controls .control-wrap:has(>.icon)>select{padding-left:8px}.top-controls{gap:4px}.avatar{display:none}.kpi-value{display:block}.kpi .unit{display:block}.pending{grid-template-columns:minmax(100px,1fr) auto 16px}.pending .muted{display:none}.capacity-rail{min-width:315px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
const $ = (query, root = document) => root.querySelector(query);
const $$ = (query, root = document) => [...root.querySelectorAll(query)];
const byId = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = value => `¥${Number(value).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;

const signed = value => `${value < 0 ? '−' : '+'}${money(Math.abs(value))}`;
const hours = ['16','17','18','19','20','21','22','23','00','01','02'];
const currentHour = '17';

const stores = [

const storeById = id => stores.find(store => store.id === id);
const storeName = id => storeById(id).name;
const orderStates = ['待到店','进行中','已完成','已取消'];
const orders = [
  ['MO-1123-061','university','11/23 18:00–19:00','林嘉',10,0,'11/23 16:58'],

  ['MO-1123-055','xixi','11/23 16:00–17:00','唐亦',18,2,'11/23 15:48'],

function reviewDrawer(id){
  const review=reviews.find(r=>r.id===id);
  showDrawer('结算复核',id,
    details('复核单',[['门店',storeName(review.store)],['时段',review.slot],['原因',review.reason],['差额',`<span class="${review.gate<review.claim?'urgent':'muted'}">${signed(review.gate-review.claim)}</span>`]],'01')+
    details('门禁事件时间线',[['入场',review.entry[0]],['离场',review.entry[1]],['应结',money(review.gate)]],'02')+
    details('顾客申报时间',[['申报入场',review.reported[0]],['申报离场',review.reported[1]],['申报金额',money(review.claim)]],'03'),
    btn('按门禁结算','review-gate','prime',id)+btn('按申报结算','review-claim','line',id)+btn('转人工','review-manual','line',id));
}
function saveReview(id,decision){
  const index=reviews.findIndex(r=>r.id===id);
  const review=reviews[index];
  if(decision==='manual') review.manual=true;
  else {
    reviews.splice(index,1);
    const amount=review[decision];
    settled.unshift(['11/23',id,review.store,amount,'已结算']);
    if(amount!==review.gate) revisions.unshift([id,review.gate,amount,'陈默','11/23 17:20']);
  }
  drawer.close();settlementsPage();announce(decision==='manual'?'已转人工处理':'已确认结算');
}
function memberDrawer(index){
  const [name,phone,count,card,balance,recent]=members[index];
  const storeIds=['university','binjiang','university','xixi','university','jiangnan'];
  const history=[recent,'11/19 17:20','11/17 19:02','11/15 18:44','11/13 16:05'].slice(0,Math.min(count,5));
  showDrawer('会员详情',name,details('基本信息',[['手机',phone],['累计到场',`${count} 次`]],'01')+
    details('会员卡',[['当前卡',card],['余额',balance===null?'—':`${balance} ${index===2?'小时':'次'}`]],'02')+
    details('最近 5 次到店',history.map(time=>[time,storeName(storeIds[index])]),'03')+
    details('卡流水 · card_ledger',card==='—'?[['流水','无']]:[[recent,index===1?'月卡核销':index===2?'到店核销 · −1 小时':'到店核销 · −1 次'],['11/09 20:06','购卡入账']],'04'));
}
function productDrawer(id){
  const p=products.find(item=>item.id===Number(id));
  showDrawer('卡产品',p?p.name:'新建卡产品',`<form id="product-form" class="form-fields" data-id="${p?.id||''}">
    <label>名称<input name="name" required maxlength="40" value="${esc(p?.name||'')}"></label>
    <label>类型<span class="field-select"><select name="type">${types.map((type,i)=>`<option value="${i}"${(p?.type??0)===i?' selected':''}>${type}</option>`).join('')}</select></span></label>
    <label>价格（元）<input name="price" type="number" min="0" max="99999" step="0.01" required value="${p?.price??''}"></label>
    <label>次数<input name="count" type="number" min="1" max="999" required value="${p?.count??1}"></label>
    <label>有效期（天）<input name="days" type="number" min="1" max="3650" required value="${p?.days??30}"></label>
    </form>`, `<button class="btn prime" type="submit" form="product-form">保存</button>${p?btn(p.active?'停售':'恢复销售','product-toggle','line',p.id):''}`);
}
drawer.addEventListener('submit',event=>{
  if(event.target.id!=='product-form') return;
  event.preventDefault();
  const form=event.target;
  const nameField=form.elements.namedItem('name');
  const name=nameField.value.trim();
  if(!name){nameField.setCustomValidity('请输入卡产品名称');nameField.reportValidity();return;}
  const data=Object.fromEntries(new FormData(form));
  const update={name,type:Number(data.type),price:Number(data.price),count:Number(data.count),days:Number(data.days)};
  const product=products.find(p=>p.id===Number(form.dataset.id));
  if(product) Object.assign(product,update);
  else products.push({id:Math.max(...products.map(p=>p.id))+1,...update,sold:0,active:true});
  drawer.close();productsPage();announce('卡产品已保存');
});

function changeTab(value){
  state.tab=value;
  for(const tab of $$('#settlements [role=tab]')){
    const active=tab.dataset.value===value;
    tab.setAttribute('aria-selected',active);
    tab.tabIndex=active?0:-1;
    byId(tab.getAttribute('aria-controls')).hidden=!active;
  }
}
const actions={
  'order-sort'(key){state.asc=state.sort===key?!state.asc:true;state.sort=key;orderTable();$(`[data-action="order-sort"][data-value="${key}"]`).focus();},
  order:orderDrawer,
  contact(id){const order=orders.find(o=>o.id===id);const phone=members.find(m=>m[0]===order.customer)?.[1]||'未留电话';showDrawer('联系顾客',order.customer,details('联系方式',[['手机（脱敏）',phone]]),btn('返回订单','order','line',id));},
  'order-cancel'(id){showDrawer('订单操作','取消预约',details('预约',[['订单号',id]]),btn('确认取消','order-confirm','line',id)+btn('返回','order','line',id));},
  'order-confirm'(id){const order=orders.find(o=>o.id===id);order.state=3;order.amount=0;drawer.close();if(state.route==='orders') orderTable();announce('预约已取消');},
  'settlement-tab':changeTab,
  review:reviewDrawer,
  'review-gate'(id){saveReview(id,'gate');},
  'review-claim'(id){saveReview(id,'claim');},
  'review-manual'(id){saveReview(id,'manual');},
  'store-detail'(id){state.storeDetail=id;storesPage();$(`[data-action="store-detail"][data-value="${id}"]`).focus();},
  'toggle-store'(){const store=storeById(state.storeDetail);store.paused=!store.paused;storesPage();$('[data-action="toggle-store"]').focus();},
  member:memberDrawer,
  product:productDrawer,
  'new-product'(){productDrawer();},
  'product-toggle'(id){const p=products.find(product=>product.id===Number(id));p.active=!p.active;drawer.close();productsPage();announce(p.active?'已恢复销售':'卡产品已停售');},
  'admin-remove'(index){showDrawer('管理员','移除管理员',details('账户',[['姓名',administrators[index][0]],['角色',administrators[index][1]]]),btn('确认移除','admin-confirm','line',index));},
  'admin-confirm'(index){administrators.splice(Number(index),1);drawer.close();settingsPage();announce('管理员已移除');},
  'merchant-disable'(){showDrawer('危险操作','停用商家','',btn('确认停用','merchant-confirm'));},
  'merchant-confirm'(){state.merchantActive=false;stores.forEach(store=>{store.paused=true;});drawer.close();settingsPage();announce('商家已停用');}
};
document.addEventListener('click',event=>{
  const trigger=event.target.closest('[data-action]');
  if(trigger) actions[trigger.dataset.action](trigger.dataset.value);
});
document.addEventListener('keydown',event=>{
  const tab=event.target.closest('#settlements [role=tab]');
  if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
  const tabs=$$('#settlements [role=tab]');
  const i=event.key==='Home'?0:event.key==='End'?tabs.length-1:(tabs.indexOf(tab)+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  event.preventDefault();changeTab(tabs[i].dataset.value);tabs[i].focus();
});
byId('drawer-close').innerHTML=icon('close');
byId('drawer-close').addEventListener('click',()=>drawer.close());
document.addEventListener('click',event=>{
  if(!drawer.open||event.target.matches('.table-wrap')) return;
  if(drawer.contains(event.target)){
    const {left,right,top,bottom}=drawer.getBoundingClientRect();
    if(event.target!==drawer||(event.clientX>=left&&event.clientX<right&&event.clientY>=top&&event.clientY<bottom)) return;
  }
  drawer.close();
  event.preventDefault();event.stopPropagation();
},true);
document.addEventListener('keydown',event=>{
  if(drawer.open&&event.key==='Escape'){event.preventDefault();drawer.close();}
});
document.addEventListener('change',event=>{
  const t=event.target;
  if(t.id==='top-store'){
    state.store=t.value;
    if(state.route==='overview') overview();
    if(state.route==='orders'){byId('order-store').value=t.value;orderTable();}
  }else if(t.id==='top-range'){
    state.range=t.value;if(state.route==='overview') overview();
  }else if(t.id==='order-status'){
    state.orderStatus=t.value;orderTable();
  }else if(t.id==='order-store'){
    state.store=t.value;byId('top-store').value=t.value;orderTable();
  }else if(t.hasAttribute('data-capacity')){
    const store=storeById(state.storeDetail),i=Number(t.dataset.capacity);
    if(t.value!==''&&t.checkValidity()) store.capacity[i]=t.valueAsNumber;
    else t.value=store.capacity[i];
  }
});
document.addEventListener('input',event=>{
  const t=event.target;
  if(t.id==='order-search'){state.orderQuery=t.value;orderTable();}
  else if(t.id==='member-search'){state.memberQuery=t.value;memberTable();}
  else if(t.name==='name'&&t.form?.id==='product-form') t.setCustomValidity('');
});
const links=Object.entries(names);
const navItem=([key,name],number)=>`<a class="nav-link" href="#${key}" aria-label="${name}">${icon(key)}<span>${name}</span><span class="u nav-n" aria-hidden="true">${String(number).padStart(2,'0')}</span></a>`;
byId('nav').innerHTML=`<div class="u nav-label">经营</div><div class="nav-group">${links.slice(0,3).map((entry,i)=>navItem(entry,i+1)).join('')}</div><div class="u nav-label">管理</div><div class="nav-group">${links.slice(3).map((entry,i)=>navItem(entry,i+4)).join('')}</div>`;
byId('top-store').innerHTML=pick(stores);
byId('top-store-wrap').insertAdjacentHTML('afterbegin',icon('stores'));
byId('top-range-wrap').insertAdjacentHTML('afterbegin',icon('calendar'));
let transition;
function route(){
  const hash=location.hash.slice(1);
  const next=Object.hasOwn(names,hash)?hash:'overview';
  if(next===state.route) return;
  const first=!state.route;
  state.route=next;
  if(drawer.open) drawer.close();
  const update=()=>{
    if(state.route!==next) return;
    render[next]();
    for(const screen of $$('.screen')){
      screen.hidden=screen.id!==next;screen.classList.remove('enter');
    }
    for(const link of $$('#nav .nav-link')){
      if(link.hash===`#${next}`) link.setAttribute('aria-current','page');
      else link.removeAttribute('aria-current');
    }
    byId('page-title').textContent=names[next];
    document.title=`${names[next]} · MONO 商家后台`;
    window.scrollTo(0,0);
  };
  transition?.skipTransition();
  if(!first&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    transition=document.startViewTransition(update);
  }else{
    update();if(!first) byId(next).classList.add('enter');
  }
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
